<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="task4.css" />
</head>
<body>

  <nav class="navbar">
    <a href="index.html">Task 1</a>
    <a href="task2.html">Task 2</a>
    <a href="task3/index.html">Task 3</a>
    <a href="task4.html" class="active">Task 4</a>
  </nav>

  <h1 id="table-title">Student Grades — Bleach Class</h1>

  <table class="grades-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Subject</th>
        <th>Grade</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Ichigo Kurosaki</td>
        <td>Mathematics</td>
        <td>A</td>
      </tr>
      <tr class="highlight-row">
        <td>Rukia Kuchiki</td>
        <td>Literature</td>
        <td>A+</td>
      </tr>
      <tr>
        <td>Renji Abarai</td>
        <td>Physical Education</td>
        <td>B+</td>
      </tr>
      <tr>
        <td colspan="2">Class Average</td>
        <td>A-</td>
      </tr>
    </tbody>
  </table>

  <h1 id="form-title">Feedback Form</h1>

  <form class="feedback-form">
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" placeholder="Ichigo Kurosaki" required />

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="ichigo@gmail.com" required />

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone" placeholder="+7 777 123 4567" />

    <label for="role">Role</label>
    <select id="role" name="role">
      <option value="student">Student</option>
      <option value="teacher">Teacher</option>
      <option value="other">Other</option>
    </select>

    <p class="radio-label">Would you recommend this course?</p>
    <div class="radio-group">
      <label><input type="radio" name="recommend" value="yes" /> Yes</label>
      <label><input type="radio" name="recommend" value="no" /> No</label>
    </div>

    <label for="comments">Comments</label>
    <textarea id="comments" name="comments" rows="4" placeholder="Write your feedback here..."></textarea>

    <button type="submit" class="submit-btn">Submit</button>
  </form>

  <footer class="footer">
    <p>&copy; 2026 Bazaraly Ramazan · SE-2526</p>
  </footer>

</body>
</html>
